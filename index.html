<script>
/* HIỆU ỨNG MATRIX RAIN */
(() => {
  const canvas = document.getElementById("matrix");
  const ctx = canvas.getContext("2d");
  if (!ctx) return;

  const chars = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZアイウエオ";
  const size = 15;
  let width, height, drops = [], raf = 0;
  let running = true;

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    canvas.style.width = width + "px";
    canvas.style.height = height + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const columns = Math.ceil(width / size);
    drops = Array.from(
      {length: columns},
      () => Math.random() * (height / size)
    );
  }

  function draw() {
    if (!running) return;

    ctx.fillStyle = "rgba(2, 11, 5, 0.13)";
    ctx.fillRect(0, 0, width, height);
    ctx.font = size + "px monospace";

    for (let i = 0; i < drops.length; i++) {
      const char = chars[Math.floor(Math.random() * chars.length)];
      ctx.fillStyle = Math.random() > 0.97 ? "#caffd7" : "#00ff66";
      ctx.fillText(char, i * size, drops[i] * size);

      if (drops[i] * size > height && Math.random() > 0.975) {
        drops[i] = 0;
      }
      drops[i] += 0.45 + Math.random() * 0.45;
    }

    raf = requestAnimationFrame(draw);
  }

  window.addEventListener("resize", resize);

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      running = false;
      cancelAnimationFrame(raf);
    } else if (!running) {
      running = true;
      draw();
    }
  });

  resize();
  draw();
})();
</script>
